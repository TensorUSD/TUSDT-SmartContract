[workspace.package]
license = "MIT-0"
authors = ["tensorusd admin@tensorusd.com"]
homepage = ""
repository = ""
edition = "2021"

# workspace-wide. Contracts that cannot meet a lint must allow it at the
# narrowest possible scope with a comment justifying why it is unreachable.
[workspace.lints.clippy]
arithmetic-side-effects = "deny"
unwrap-used = "deny"
expect-used = "deny"
indexing-slicing = "deny"

[profile.release]
overflow-checks = true

[workspace]
members = [
    "env",
    "primitives",
    "voting",
    "test-support",
    "contracts/tusdt-erc20",
    "contracts/tusdt-auction",
    "contracts/tusdt-oracle",
    "contracts/tusdt-vault-alpha",
    "contracts/tusdt-treasury",
    "contracts/tusdt-governance",
    "contracts/tusdt-election",
    "contracts/tusdt-lending-pool",
]
resolver = "2"

[workspace.dependencies]
ink = { version = "5.1.1", default-features = false }
parity-scale-codec = { version = "3.0.0", default-features = false }
sp-arithmetic = { version = "26.1.0", default-features = false }

ink_e2e = { version = "5.1.1" }
